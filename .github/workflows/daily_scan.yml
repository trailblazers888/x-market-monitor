name: Daily Market Scan
on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC = 4:30pm Kuala Lumpur, every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Requirements
        run: pip install requests
      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python x_monitor.py
      - name: Save report to repo
        run: |
          git config user.name "x-monitor-bot"
          git config user.email "x-monitor-bot@users.noreply.github.com"
          git add reports
          git diff --staged --quiet || git commit -m "Scan report $(date -u +%F)"
          git pull --rebase origin main
          git push
